<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Definir senha · SCORE</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#0b1220" />
<style>
  :root {
    --bg: #0b1220;
    --card: #131c30;
    --border: #24304a;
    --text: #e8edf7;
    --text-dim: #8b98b3;
    --accent: #6aa8ff;
    --accent-2: #f2c14e;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 20% 0%, #1a2438 0%, #0b1220 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 1rem;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem 1.75rem;
  }
  .logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; justify-content: center; }
  .logo img { width: 36px; height: 36px; border-radius: 9px; }
  .logo span { font-weight: 800; letter-spacing: 0.5px; font-size: 1.15rem; }
  h1 { font-size: 1.1rem; margin: 0 0 0.35rem; text-align: center; }
  p.sub { color: var(--text-dim); font-size: 0.85rem; text-align: center; margin: 0 0 1.5rem; line-height: 1.4; }
  label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.3rem; }
  input {
    width: 100%;
    background: #0e1626;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 0.65rem 0.8rem;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #06101f;
    border: none;
    border-radius: 9px;
    padding: 0.7rem;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .erro { color: var(--danger); font-size: 0.8rem; margin: -0.5rem 0 1rem; min-height: 1em; }
  .ok { color: var(--accent-2); font-size: 0.85rem; text-align: center; }
  .estado { text-align: center; color: var(--text-dim); font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/icon-192.png" alt="" />
      <span>SCORE</span>
    </div>
    <div id="app">
      <p class="estado">Verificando seu link de acesso…</p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://xjvjeidmchuszubjunsb.supabase.co',
      'sb_publishable_mWCNxT93aY-lfEY7rVqoCg_vpLSAhMx'
    );

    const app = document.getElementById('app');

    function telaFormulario() {
      app.innerHTML = `
        <h1>Defina sua senha</h1>
        <p class="sub">Escolha uma senha de acesso ao SCORE. Você poderá trocá-la depois se quiser.</p>
        <label for="s1">Nova senha</label>
        <input id="s1" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        <label for="s2">Confirmar senha</label>
        <input id="s2" type="password" placeholder="Repita a senha" autocomplete="new-password" />
        <div class="erro" id="erro"></div>
        <button id="btn">Salvar e entrar</button>
      `;
      const erro = document.getElementById('erro');
      const btn = document.getElementById('btn');
      btn.addEventListener('click', async () => {
        const s1 = document.getElementById('s1').value;
        const s2 = document.getElementById('s2').value;
        erro.textContent = '';
        if (s1.length < 6) { erro.textContent = 'A senha precisa ter no mínimo 6 caracteres.'; return; }
        if (s1 !== s2) { erro.textContent = 'As senhas não coincidem.'; return; }
        btn.disabled = true;
        btn.textContent = 'Salvando…';
        const { error } = await supabase.auth.updateUser({ password: s1 });
        if (error) {
          erro.textContent = 'Não foi possível salvar a senha. Peça um novo link ao administrador.';
          btn.disabled = false;
          btn.textContent = 'Salvar e entrar';
          return;
        }
        app.innerHTML = '<p class="ok">Senha salva! Entrando…</p>';
        setTimeout(() => { window.location.href = './index.html'; }, 900);
      });
    }

    function telaErro() {
      app.innerHTML = `
        <p class="estado">Este link expirou ou já foi usado.<br/>Peça ao administrador para reenviar o convite de acesso.</p>
      `;
    }

    // Um cliente novo, com detectSessionInUrl (padrão true), processa o
    // token de recovery presente no hash da URL automaticamente e dispara
    // este evento assim que a sessão temporária é estabelecida.
    let resolvido = false;
    supabase.auth.onAuthStateChange((event, session) => {
      if (resolvido) return;
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        resolvido = true;
        telaFormulario();
      }
    });

    // Salvaguarda: se depois de alguns segundos nenhuma sessão foi
    // estabelecida, o link é inválido/expirado.
    setTimeout(async () => {
      if (resolvido) return;
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        resolvido = true;
        telaFormulario();
      } else {
        telaErro();
      }
    }, 2500);
  </script>
</body>
</html>
